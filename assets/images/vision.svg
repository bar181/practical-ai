<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 660" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">A job you repeat, done to standard: three steps</title>
<desc id="d">Three steps from top to bottom: a job you repeat, a Practical AI tool, and the job done to standard while you check and decide. The example changes in turn and loops: an office manager's Monday sales report becomes a professional page with Artifact Studio; a team lead's 40-page contract becomes what it asks of you and by when with Document to action brief; a developer's new internal tool is built to a tested standard with Agentic Process. Underneath, a line from business people to developers: everyone an agentic engineer.</desc>
<style>
.cy{opacity:0;animation:show 12s infinite backwards}
.a{opacity:1}
.b{animation-delay:4s}.c{animation-delay:8s}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
.tick{stroke-dasharray:40;stroke-dashoffset:40;animation:tick 4s infinite}
@keyframes show{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes tick{0%,40%{stroke-dashoffset:40}55%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.cy,.flow,.tick{animation:none}.cy{opacity:0}.a{opacity:1}.tick{stroke-dashoffset:0}}
</style>
<rect width="440" height="660" rx="22" fill="#0c2340"/>
<text x="220" y="50" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">A job you repeat, done to standard</text>
<g fill="#ffd23f" font-size="19" font-weight="700">
  <text x="30" y="98">1. A job you repeat</text>
  <text x="30" y="258">2. A Practical AI tool</text>
  <text x="30" y="420">3. Done to standard</text>
</g>
<g fill="#17365f" stroke="#8fb3e8" stroke-width="2">
  <rect x="30" y="110" width="380" height="88" rx="18"/>
  <rect x="30" y="270" width="380" height="94" rx="18"/>
  <rect x="30" y="432" width="380" height="94" rx="18"/>
</g>
<path class="flow" d="M220 206v24" stroke="#8fb3e8" stroke-width="4" stroke-linecap="round"/>
<path class="flow" d="M220 372v24" stroke="#8fb3e8" stroke-width="4" stroke-linecap="round"/>
<g class="cy a" fill="#fff" text-anchor="middle">
  <text x="220" y="140" font-size="17" fill="#8fb3e8">An office manager</text>
  <text x="220" y="174" font-size="23" font-weight="700">The Monday sales report</text>
  <text x="220" y="308" font-size="23" font-weight="700">Artifact Studio</text>
  <text x="220" y="340" font-size="17" fill="#cfe0f7">A designer's method, in your chatbot</text>
  <text x="220" y="470" font-size="22" font-weight="700">A page that looks professional</text>
  <text x="220" y="502" font-size="17" fill="#cfe0f7">in minutes</text>
</g>
<g class="cy b" fill="#fff" text-anchor="middle">
  <text x="220" y="140" font-size="17" fill="#8fb3e8">A team lead</text>
  <text x="220" y="174" font-size="23" font-weight="700">A 40-page contract</text>
  <text x="220" y="308" font-size="23" font-weight="700">Document to action brief</text>
  <text x="220" y="340" font-size="17" fill="#cfe0f7">Exact words on every line</text>
  <text x="220" y="470" font-size="22" font-weight="700">What it asks of you, by when</text>
  <text x="220" y="502" font-size="17" fill="#cfe0f7">ready to check</text>
</g>
<g class="cy c" fill="#fff" text-anchor="middle">
  <text x="220" y="140" font-size="17" fill="#8fb3e8">A developer</text>
  <text x="220" y="174" font-size="23" font-weight="700">A new internal tool</text>
  <text x="220" y="308" font-size="23" font-weight="700">Agentic Process</text>
  <text x="220" y="340" font-size="17" fill="#cfe0f7">A method, an example and a test</text>
  <text x="220" y="470" font-size="22" font-weight="700">Built to a tested standard</text>
  <text x="220" y="502" font-size="17" fill="#cfe0f7">and reusable</text>
</g>
<g transform="translate(140 556)">
