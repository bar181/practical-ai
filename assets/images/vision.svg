</g>
<text x="164" y="562" fill="#fff" font-size="18" font-weight="600">You check and decide</text>
<line x1="30" y1="600" x2="410" y2="600" stroke="#8fb3e8" stroke-width="2" opacity=".5"/>
<g fill="#ffd23f"><circle class="cy a" cx="90" cy="600" r="7"/><circle class="cy b" cx="220" cy="600" r="7"/><circle class="cy c" cx="350" cy="600" r="7"/></g>
<g fill="#8fb3e8" font-size="15"><text x="30" y="590">Business people</text><text x="410" y="590" text-anchor="end">Developers</text></g>
