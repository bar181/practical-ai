<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">The jobs you repeat, by how often you do them</title>
<desc id="d">Daily: sort the inbox and turn meetings into actions, both next. Weekly: a slide deck or report, ready now, and posts for the week. Monthly: the monthly report, and receipts into a sheet, next. The AI does the drafting. You check it and make the call.</desc>
