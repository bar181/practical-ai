idth="212" height="52" rx="10" fill="#fffdf5"/><text x="558" y="193" fill="#0c2340" font-size="20" font-weight="700">Monthly report</text><rect x="546" y="226" width="212" height="52" rx="10" fill="#c9d4e4"/><text x="558" y="259" fill="#0c2340" font-size="20" font-weight="700">Receipts to a sheet</text><rect x="696" y="214" width="56" height="24" rx="12" fill="#8fb3e8"/><text x="724" y="231" text-anchor="middle" fill="#0c2340" font-size="15" font-weight="800">Next</text>
