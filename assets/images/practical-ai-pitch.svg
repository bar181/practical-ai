<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Practical AI in one picture</title>
<desc id="d">At the top: Practical AI gets better work from the AI you already use, with a proven process for the jobs you repeat, and faster. Below, two projects light up in turn. Artifact Studio, designed pages told well: rough notes go in, a report, deck or post comes out. Agentic Process, tools that catch mistakes: a job you repeat goes in, a tested tool comes out, a README, one SKILL.md and a worked example. At the bottom: the AI drafts, you check and decide.</desc>
<style>
.card{animation:lit 10s infinite}
.b{animation-delay:5s}
@keyframes lit{0%{stroke:#3d5f8f;fill:#17365f}5%,45%{stroke:#ffd23f;fill:#21497d}50%,100%{stroke:#3d5f8f;fill:#17365f}}
.flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){.card,.flow{animation:none}.card{stroke:#ffd23f}}
</style>
<rect width="800" height="520" rx="22" fill="#0c2340"/>
<text x="400" y="58" text-anchor="middle" fill="#ffd23f" font-size="34" font-weight="700">Practical AI</text>
<text x="400" y="96" text-anchor="middle" fill="#fff" font-size="24">Better work from the AI you already use.</text>
<text x="400" y="128" text-anchor="middle" fill="#cfd8e6" font-size="20">A proven process for the jobs you repeat. Faster, too.</text>

<rect class="card a" x="36" y="160" width="350" height="270" rx="18" fill="#17365f" stroke="#3d5f8f" stroke-width="3"/>
<text x="211" y="202" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">Artifact Studio</text>
<text x="211" y="232" text-anchor="middle" fill="#cfd8e6" font-size="19">Designed pages, told well</text>
<g transform="translate(64 262)">
  <rect width="92" height="112" rx="6" fill="#fffdf5"/>
  <g stroke="#0c2340" stroke-width="4" stroke-linecap="round" opacity=".7"><path d="M14 22h52"/><path d="M14 44h64" opacity=".5"/><path d="M14 64h58" opacity=".5"/><path d="M14 86h40"/></g>
  <text x="46" y="138" text-anchor="middle" fill="#cfd8e6" font-size="17">Rough notes</text>
</g>
<path class="flow" d="M166 318h48" stroke="#8fb3e8" stroke-width="4" stroke-linecap="round"/>
<g transform="translate(222 262)">
  <rect width="132" height="112" rx="8" fill="#fff"/>
  <rect x="12" y="12" width="80" height="12" rx="3" fill="#1b5e20"/>
  <rect x="12" y="34" width="32" height="26" rx="4" fill="#e8f0e8"/><rect x="50" y="34" width="32" height="26" rx="4" fill="#e8f0e8"/><rect x="88" y="34" width="32" height="26" rx="4" fill="#e8f0e8"/>
  <rect x="12" y="72" width="88" height="10" rx="3" fill="#5f6b5f"/><rect x="12" y="88" width="108" height="10" rx="3" fill="#2f6fed"/>
  <text x="66" y="138" text-anchor="middle" fill="#cfd8e6" font-size="17">Report, deck, post</text>
</g>

<rect class="card b" x="414" y="160" width="350" height="270" rx="18" fill="#17365f" stroke="#3d5f8f" stroke-width="3"/>
<text x="589" y="202" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">Agentic Process</text>
<text x="589" y="232" text-anchor="middle" fill="#cfd8e6" font-size="19">Tools that catch mistakes</text>
<g transform="translate(442 262)">
  <rect width="92" height="112" rx="6" fill="#fffdf5"/>
  <text x="46" y="50" text-anchor="middle" fill="#0c2340" font-size="16" font-weight="700">A job</text>
  <text x="46" y="72" text-anchor="middle" fill="#0c2340" font-size="16" font-weight="700">you repeat</text>
  <text x="46" y="138" text-anchor="middle" fill="#cfd8e6" font-size="17">In</text>
</g>
<path class="flow" d="M544 318h48" stroke="#8fb3e8" stroke-width="4" stroke-linecap="round"/>
<g transform="translate(600 262)" font-size="14" font-weight="700" fill="#0c2340">
  <rect width="132" height="30" rx="7" fill="#ffd23f"/><text x="66" y="20" text-anchor="middle">README.md</text>
  <rect y="40" width="132" height="30" rx="7" fill="#ffd23f"/><text x="66" y="60" text-anchor="middle">SKILL.md</text>
  <rect y="80" width="132" height="30" rx="7" fill="#ffd23f"/><text x="66" y="100" text-anchor="middle">example.md</text>
  <text x="66" y="138" text-anchor="middle" fill="#cfd8e6" font-size="17" font-weight="400">Tested, then yours</text>
</g>

<text x="400" y="476" text-anchor="middle" fill="#ffd23f" font-size="22" font-weight="700">The AI drafts. You check and decide.</text>
</svg>
