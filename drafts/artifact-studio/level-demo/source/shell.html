<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifact studio</title>
<style>
/*FONTS*/
:root{
  /* Layout idea: a short header, then tabs that are radio buttons (they switch with no script), then one view. Phone first. */
  --fog:#e8edf3;--mist:#d6dfea;--sky:#a5b9d8;--slate:#4b596e;--pine:#1b2228;--pine-2:#28343d;--reed:#d2b78c;--rust:#774528;
  --display:"National Park","Avenir Next","Segoe UI",system-ui,sans-serif;
  --text:"Crimson Pro","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --work:"Work Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --plex:"IBM Plex Serif",Georgia,serif;
  color-scheme:light;
  /*PHOTOS*/
}
/*BASE_CSS*/

/* studio shell */
.view{display:none}
.tabr{position:absolute;top:0;left:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.mast{background:var(--pine);color:var(--fog);padding:16px 0 2px}
.mast .mast-t{font:700 clamp(1.3rem,5.4vw,2.1rem)/1.1 var(--display);letter-spacing:-.012em;color:var(--fog);margin:0}
.mast .mast-t span{color:var(--reed)}
.mast .mast-l{font:400 .94rem/1.4 var(--display);color:#c2cede;margin:6px 0 0;max-width:40em}
.tabs{background:var(--pine);padding:6px 0 12px;position:relative;z-index:40}
.tabs>div{display:flex;flex-wrap:wrap;gap:6px;padding:5px 20px;max-width:1080px;margin-inline:auto}
.tabs label{flex:none;font:700 .86rem/1 var(--display);color:#dbe3ee;padding:0 12px;min-height:40px;display:flex;align-items:center;border-radius:999px;cursor:pointer;border:1.5px solid #5b6b7a;user-select:none;-webkit-user-select:none}
.tabs .tabs-s{display:none;border-top:1px solid #36434d;margin-top:5px;padding-top:9px}
.tabs .tabs-s label{border-color:transparent;background:var(--pine-2);font-size:.86rem;min-height:40px}
.tabs .tabs-s span{font:400 .84rem/1 var(--display);color:#c2cede;display:flex;align-items:center;width:100%}
.about{background:var(--fog);color:var(--pine);font:400 .96rem/1.42 var(--display);padding:13px 0 12px;border-bottom:3px solid var(--reed);text-align:left}
.about p{margin:0;max-width:44em}.about b{font-weight:700}
.about .about-n{margin-top:4px;font-size:.88rem;color:var(--slate)}
.about a{color:var(--rust);font-weight:700;text-underline-offset:3px}
.pager{background:var(--pine);color:var(--fog);padding:26px 20px 60px}
.pager div{max-width:1080px;margin-inline:auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font:700 1rem/1.3 var(--display)}
.pager label{min-height:44px;display:flex;align-items:center;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* shared: behind this page */
.anat{background:var(--fog);color:var(--pine);font:400 1.22rem/1.5 var(--text);padding:72px 0 64px;text-align:left}
.anat h2{font:700 clamp(2rem,6vw,3rem)/1.04 var(--display);letter-spacing:-.012em;color:var(--pine)}
.anat h3{font:700 1.02rem/1.25 var(--display);color:var(--pine)}
.anat>.wrap>p{margin-top:12px;color:var(--slate)}
.anat-grid{display:grid;gap:22px;margin-top:28px}
.anat-grid>div{background:#f3f6fa;border-radius:10px;padding:18px}
.anat-grid ol,.anat-grid ul{margin:10px 0 0;padding-left:1.2em;display:grid;gap:6px;font:400 .95rem/1.4 var(--display)}
.levels{display:grid;gap:12px;margin-top:22px}
.levels .ask h3 b{color:var(--pine)}
@media(min-width:760px){.anat-grid{grid-template-columns:1fr 1fr}}
.sample-note{font:400 .8rem/1.35 var(--display);opacity:.75}
/* cards used on index tabs */
.shelf-head{padding-top:56px}
.shelf-head p{margin-top:12px;color:var(--slate)}
.cards{list-style:none;margin:28px auto 0;padding:0 20px 80px;max-width:1080px;display:grid;gap:14px}
.cards a{display:grid;gap:6px;text-decoration:none;border-radius:14px;padding:20px;min-height:150px;align-content:end;position:relative;overflow:hidden}
.cards h3{font-size:1.5rem;line-height:1.05}
.cards p{font:400 .92rem/1.4 var(--display)}
.cards small{font:400 .8rem/1.3 var(--display);opacity:.8}
@media(min-width:760px){.cards{grid-template-columns:1fr 1fr}}
@media(min-width:1040px){.cards.three{grid-template-columns:1fr 1fr 1fr}}
.md{background:var(--fog);color:var(--pine);padding:44px 0 70px;font:400 1.16rem/1.55 var(--text)}
.md>.wrap{max-width:820px}
.md h1{font-size:clamp(2rem,7.4vw,3.2rem);line-height:1.02}
.md h2{font-size:clamp(1.5rem,5.2vw,2.1rem);line-height:1.1;margin-top:1.7em}
.md h3{font-size:1.2rem;line-height:1.2;margin-top:1.5em}
.md p,.md ul,.md ol{margin:.75em 0 0}.md ul,.md ol{padding-left:1.25em}.md li{margin-top:.3em}
.md code{font:400 .86em var(--mono);background:#d6dfea;border-radius:4px;padding:.08em .3em;overflow-wrap:anywhere}
.md .codeb{position:relative;margin-top:1em;background:var(--pine);border-radius:12px;padding:16px 16px 12px;display:grid;gap:10px}
.md pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#e8edf3;font:400 .86rem/1.5 var(--mono)}
.md pre code{background:none;padding:0;font-size:1em;color:inherit}
.md .codeb .copy{justify-self:start;background:var(--reed);color:var(--pine)}
.md .tblw{margin-top:1em;overflow-x:auto;border-radius:10px;background:#fff}
.md table{border-collapse:collapse;width:100%;font:400 .95rem/1.4 var(--display)}
.md th,.md td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid #d6dfea}
.md th{font-weight:700;background:#f3f6fa}
.md th:empty{padding:0;border:0}
.md blockquote{margin:1em 0 0;padding:2px 0 2px 16px;border-left:4px solid var(--reed);color:var(--slate)}
.md a{color:var(--rust)}
.md li.task{list-style:none;margin-left:-1.25em}
.md li.task label{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:8px 10px;border-radius:10px;background:#fff;cursor:pointer;font:400 1.02rem/1.4 var(--display)}
.md li.task input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--pine)}
.md li.task input:checked+span{color:var(--slate);text-decoration:line-through}
.view>.md:not(:first-child){padding-top:34px}
.md.sub h2:first-child{margin-top:0}
/*TAB_CSS*/
/*VIEW_CSS*/
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><i></i></div>
<!--MAST-->
<!--RADIOS-->
<!--NAV-->
<!--VIEWS-->
<script>
(()=>{
const STUDIO={data:__DATA__};window.STUDIO=STUDIO;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const html=document.documentElement;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const NS='http://www.w3.org/2000/svg';
const el=(n,a={},t)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e};
const HOOKS={};const onView=(name,fn)=>{HOOKS[name]=fn};
/* count a number up once, when it scrolls into view */
STUDIO.countUp=root=>{const io=new IntersectionObserver((es,o)=>{for(const e of es)if(e.isIntersecting){o.unobserve(e.target);const n=e.target,to=+n.dataset.count,dec=(n.dataset.count.split('.')[1]||'').length,t0=performance.now();
  if(reduce){n.textContent=to.toFixed(dec);continue}
  const step=t=>{const k=clamp((t-t0)/1100),v=to*(1-Math.pow(1-k,3));n.textContent=v.toFixed(dec);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}},{threshold:.6});
  $$('[data-count]',root).forEach(n=>io.observe(n))};
/* add class "in" once an element is on screen (used for one-time draws; resting state stays visible) */
STUDIO.seen=(root,sel='.see')=>{const io=new IntersectionObserver((es,o)=>{for(const e of es)if(e.isIntersecting){e.target.classList.add('in');o.unobserve(e.target)}},{threshold:.35});$$(sel,root).forEach(n=>io.observe(n))};
/* point a background at one part of a photo: data-crop="fx,fy,zoom,aspect(w/h of photo)" */
STUDIO.crops=root=>{for(const e of $$('[data-crop]',root)){
  const [fx,fy,S,ar=4/3]=e.dataset.crop.split(',').map(Number),w=e.clientWidth||1,h=e.clientHeight||1;
  let iw=w*S,ih=iw/ar;if(ih<h){ih=h;iw=ih*ar}
  e.style.backgroundSize=iw/w*100+'% auto';
  e.style.backgroundPosition=clamp(iw>w?(fx*iw-w/2)/(iw-w):.5)*100+'% '+clamp(ih>h?(fy*ih-h/2)/(ih-h):.5)*100+'%';}};
/*VIEW_JS*/
/* scroll driver for browsers without native scroll-driven animations */
const native=CSS.supports('(animation-timeline: view()) and (animation-range: entry)')&&!window.FORCE_SD_JS;
if(!native&&!reduce){
  html.classList.add('sd-js');
  const els=$$('.sd'),bar=$('.progress');let tick=false;
  const upd=()=>{tick=false;const vh=innerHeight;
    for(const e of els){if(!e.offsetParent&&getComputedStyle(e).position!=='fixed')continue;const r=e.getBoundingClientRect();
      const p=e.dataset.range==='contain'?-r.top/Math.max(1,r.height-vh):(vh-r.top)/(vh+r.height);
      e.style.setProperty('--p',clamp(p).toFixed(4));}
    bar.style.setProperty('--p',clamp(scrollY/Math.max(1,html.scrollHeight-vh)).toFixed(4));};
  addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});
  addEventListener('resize',upd);STUDIO.sd=upd;
}
/* tabs are radio buttons, so they work with no script at all. The script adds: run each view's set-up the first time it shows, scroll to the tab bar, keep the address in step. */
const radios=$$('.tabr'),nav=$('.tabs'),routes=Object.fromEntries($$('.view').map(v=>[v.id.slice(2),v])),done=new Set();
const show=(name,move)=>{const v=routes[name];if(!v)return;
  for(const k in routes)routes[k].classList.toggle('on',routes[k]===v);html.dataset.view=name;
  if(move&&nav&&scrollY>nav.offsetTop)scrollTo({top:nav.offsetTop,behavior:'instant'});
  if(!done.has(name)){done.add(name);try{STUDIO.crops(v)}catch(err){console.error(err)}try{HOOKS[name]&&HOOKS[name](v)}catch(err){console.error(err)}}
  dispatchEvent(new Event('resize'));STUDIO.sd&&STUDIO.sd();};
const go=name=>{const r=document.getElementById('t-'+name);if(!r)return;r.checked=true;show(name,true);try{history.replaceState(null,'','#'+name)}catch{}};
radios.forEach(r=>r.addEventListener('change',()=>{if(r.checked){show(r.id.slice(2),true);try{history.replaceState(null,'','#'+r.id.slice(2))}catch{}}}));
addEventListener('hashchange',()=>go(location.hash.slice(1)));
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return}
  const j=e.target.closest('[data-jump]');if(j){e.preventDefault();const t=document.getElementById(j.dataset.jump);t&&t.scrollIntoView({behavior:reduce?'auto':'smooth'});return}
  const b=e.target.closest('.copy');if(b){const q=b.parentElement.querySelector('blockquote,pre');
    (async()=>{try{await navigator.clipboard.writeText(q.textContent.trim());b.textContent='Copied'}
      catch{const r=document.createRange();r.selectNodeContents(q);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected. Copy it from the menu'}
      setTimeout(()=>b.textContent='Copy',2400)})();}
});
const first=location.hash.slice(1);if(routes[first])go(first);else{const c=radios.find(r=>r.checked)||radios[0];if(c){c.checked=true;show(c.id.slice(2),false)}}
})();
</script>
</body>
</html>
