name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Links
        run: python3 workshop/tools/check_links.py .
      - name: Project layout
        run: |
          for p in projects/*/; do python3 workshop/tools/check_project.py "$p"; done
