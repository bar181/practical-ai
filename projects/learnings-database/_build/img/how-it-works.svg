<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">How the learnings database works</title>
<desc id="d">Three steps. 1: say log that, with what happened and what you expected. 2: get one filed row: the kind, the area, and the lesson as an instruction, When reusing a past email, check every date; saved after your yes. 3: before similar work, say before I start, and the rules that apply come back, ready to paste. At the bottom: the AI files and finds, you accept the rules.</desc>
<style>
.s{animation:in 9s ease-out infinite backwards}
.s2{animation-delay:1.2s}.s3{animation-delay:2.6s}.r1{animation-delay:3.1s}.r2{animation-delay:3.5s}.r3{animation-delay:3.9s}
.k1{animation-delay:5.2s}.k2{animation-delay:5.8s}.k3{animation-delay:6.4s}.f{animation-delay:7.2s}
@keyframes in{0%{opacity:0;transform:translateY(6px)}6%{opacity:1;transform:none}92%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.s{animation:none;opacity:1}}
.h{font-size:20px;font-weight:700;fill:#0c2340}.p{font-size:14px;fill:#33415c}.n{font-size:15px;font-weight:700;fill:#0c2340}
.lab{font-size:12.5px;font-weight:700;fill:#0c2340}.v{font-size:12.5px;fill:#33415c}.ru{font-size:12px;fill:#ffffff}
</style>
<rect width="800" height="350" rx="18" fill="#f4f6fa"/>
<!-- step 1 -->
<g class="s">
  <circle cx="44" cy="44" r="16" fill="#e8a33d"/><text x="44" y="49.5" text-anchor="middle" class="n">1</text>
  <text x="70" y="50" class="h">Say "log that"</text>
  <rect x="34" y="78" width="196" height="150" rx="14" fill="#fff" stroke="#c9d1de"/>
  <text x="50" y="106" class="lab">log that:</text>
  <text x="50" y="128" class="v">the holiday email went</text>
  <text x="50" y="146" class="v">out with last year's</text>
  <text x="50" y="164" class="v">dates. I expected</text>
  <text x="50" y="182" class="v">this year's.</text>
  <text x="132" y="258" text-anchor="middle" class="p">One sentence, in any chatbot</text>
</g>
<path class="s s2" d="M242 152 h36" stroke="#8fa0ba" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
<!-- step 2 -->
<g class="s s2">
  <circle cx="306" cy="44" r="16" fill="#e8a33d"/><text x="306" y="49.5" text-anchor="middle" class="n">2</text>
  <text x="332" y="50" class="h">One filed row</text>
  <rect x="290" y="78" width="230" height="150" rx="10" fill="#fff" stroke="#c9d1de"/>
</g>
<g class="s s3 r1"><text x="306" y="104" class="lab">error · marketing · check</text></g>
<g class="s s3 r2"><rect x="300" y="116" width="210" height="58" rx="8" fill="#1f4a5c"/>
  <text x="312" y="138" class="ru">When reusing a past email,</text><text x="312" y="158" class="ru">check every date first.</text></g>
<g class="s s3 r3"><text x="306" y="200" class="v">L-13 · proposed · seen 1</text>
  <text x="306" y="218" class="v">Saved after your yes</text></g>
<text class="s s3" x="405" y="258" text-anchor="middle" font-size="14" fill="#33415c">A repeat? Its count goes up</text>
<path class="s k1" d="M532 152 h36" stroke="#8fa0ba" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
<!-- step 3 -->
<g class="s k1">
  <circle cx="596" cy="44" r="16" fill="#e8a33d"/><text x="596" y="49.5" text-anchor="middle" class="n">3</text>
  <text x="622" y="50" class="h">Rules come back</text>
  <rect x="580" y="78" width="190" height="150" rx="10" fill="#fff" stroke="#c9d1de"/>
  <text x="596" y="104" class="lab">before I start the</text><text x="596" y="122" class="lab">December newsletter</text>
</g>
<g class="s k2"><path d="M600 146 l7 7 13 -15" stroke="#1f4a5c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="628" y="152" class="v">L-13: check every date</text></g>
<g class="s k3"><path d="M600 178 l7 7 13 -15" stroke="#1f4a5c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="628" y="184" class="v">L-4: their problem first</text></g>
<text class="s k3" x="675" y="258" text-anchor="middle" font-size="14" fill="#33415c">Only rules you accepted</text>
<text class="s f" x="400" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#0c2340">The AI files and finds. You accept the rules.</text>
</svg>
