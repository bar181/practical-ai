<g class="s a2"><path d="M232 66 H300" stroke="#8a96a8" stroke-width="3" marker-end="url(#ar)"/><g transform="translate(360 26) scale(0.3125)"><rect width="256" height="256" rx="56" fill="#be185d"/><path d="M60 70 H196 Q212 70 212 86 V156 Q212 172 196 172 H122 L88 202 V172 H60 Q44 172 44 156 V86 Q44 70 60 70 Z" fill="#fff"/><rect x="68" y="96" width="98" height="12" rx="6" fill="#be185d"/><rect x="68" y="120" width="120" height="12" rx="6" fill="#f9a8d4"/><rect x="68" y="144" width="60" height="12" rx="6" fill="#f9a8d4"/></g>
