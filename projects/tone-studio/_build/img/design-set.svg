<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">The design set: three projects, one page</title>
<desc id="d">Three steps from left to right. Web Sections: the structure, which sections in which order. Tone Studio: the words, in the tone the reader needs. Artifact Studio: the look, colour, effects and motion. Arrows join them. Each project also works alone.</desc>
