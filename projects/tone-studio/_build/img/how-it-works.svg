<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">How Tone Studio works</title>
<desc id="d">On the left, four facts from an invented bakery notice. Arrows lead to three versions of the same facts: a visionary slide in huge white type on black, a board one-pager with the decision first, and a warm goodbye email in the first person that asks for a true memory instead of inventing one. No fact is changed in any version. At the bottom: same facts, different order, nothing invented.</desc>
<style>
.s{animation:in 1s ease-out both}
.d1{animation-delay:.2s}.d2{animation-delay:1.2s}.d3{animation-delay:2.2s}.d4{animation-delay:3.2s}.d5{animation-delay:4.2s}.d6{animation-delay:5.2s}.d7{animation-delay:6.2s}.d8{animation-delay:7s}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.s{animation:none;opacity:1}}
.h{font-size:20px;font-weight:700;fill:#0c2340}.p{font-size:14px;fill:#33415c}.n{font-size:15px;font-weight:700;fill:#0c2340}
.lab{font-size:12.5px;font-weight:700;fill:#0c2340}.q{font-size:12px;fill:#5a6478}.w{font-size:13px;font-weight:700;fill:#fff}
</style>
<rect width="800" height="360" rx="18" fill="#fdf2f8"/>
<g class="s d1"><circle cx="54" cy="52" r="16" fill="#be185d"/><text x="54" y="57.5" text-anchor="middle" class="w">1</text><text x="80" y="58" class="h">Your facts</text></g>
<g class="s d1"><rect x="40" y="96" width="196" height="32" rx="16" fill="#fce7f3" stroke="#f9a8d4"/><text x="56" y="117" class="q" style="fill:#831843">Mill Street closes 13 Dec</text></g><g class="s d1"><rect x="40" y="140" width="196" height="32" rx="16" fill="#fce7f3" stroke="#f9a8d4"/><text x="56" y="161" class="q" style="fill:#831843">After 11 years</text></g><g class="s d1"><rect x="40" y="184" width="196" height="32" rx="16" fill="#fce7f3" stroke="#f9a8d4"/><text x="56" y="205" class="q" style="fill:#831843">Church Road stays open</text></g><g class="s d1"><rect x="40" y="228" width="196" height="32" rx="16" fill="#fce7f3" stroke="#f9a8d4"/><text x="56" y="249" class="q" style="fill:#831843">Free coffee on the last day</text></g>
<g class="s d2"><path d="M252 180 H300" stroke="#be185d" stroke-width="3" marker-end="url(#a)"/></g>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#be185d"/></marker></defs>
<g class="s d2"><circle cx="330" cy="52" r="16" fill="#be185d"/><text x="330" y="57.5" text-anchor="middle" class="w">2</text><text x="356" y="58" class="h">The tone your reader needs</text></g>
<g class="s d3"><rect x="316" y="84" width="140" height="196" rx="12" fill="#0b0b0f"/><text x="330" y="112" class="lab" style="fill:#f9a8d4">Visionary slide</text><text x="330" y="160" style="font-size:24px;font-weight:800;fill:#fff">Eleven</text><text x="330" y="190" style="font-size:24px;font-weight:800;fill:#fff">years.</text><text x="330" y="222" class="q" style="fill:#c9c9d1">One street.</text><text x="330" y="262" class="q" style="fill:#c9c9d1">Then Church Road.</text></g>
<g class="s d4"><rect x="472" y="84" width="140" height="196" rx="12" fill="#fff" stroke="#e5d6c3"/><text x="486" y="112" class="lab">Board one-pager</text><rect x="484" y="126" width="122" height="22" rx="4" fill="#fce7f3"/><text x="492" y="141" class="q" style="fill:#831843;font-weight:700;font-size:11px">News: closes 13 Dec</text><rect x="486" y="160" width="100" height="7" rx="3" fill="#d6dbe3"/><rect x="486" y="176" width="88" height="7" rx="3" fill="#d6dbe3"/><rect x="486" y="192" width="104" height="7" rx="3" fill="#d6dbe3"/><text x="486" y="226" class="q">Options · Risks</text><text x="486" y="246" class="q">Next steps</text></g>
<g class="s d5"><rect x="628" y="84" width="140" height="196" rx="12" fill="#fff7ed" stroke="#fed7aa"/><text x="642" y="112" class="lab">Goodbye email</text><text x="642" y="146" style="font-size:14px;font-style:italic;fill:#7c2d12">Eleven years on</text><text x="642" y="166" style="font-size:14px;font-style:italic;fill:#7c2d12">Mill Street.</text><text x="642" y="186" style="font-size:14px;font-style:italic;fill:#7c2d12">We will miss it.</text><text x="642" y="224" style="font-size:11px;fill:#5a6478">[needs: a true</text><text x="642" y="240" style="font-size:11px;fill:#5a6478">memory]</text></g>
<g class="s d6"><text x="386" y="304" text-anchor="middle" style="font-size:14px;fill:#16a34a;font-weight:800">✓ No fact changed</text><text x="542" y="304" text-anchor="middle" style="font-size:14px;fill:#16a34a;font-weight:800">✓ No fact changed</text><text x="698" y="304" text-anchor="middle" style="font-size:14px;fill:#16a34a;font-weight:800">✓ No fact changed</text></g>
<g class="s d7"><text x="400" y="342" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#9d174d">Same facts. Different order. Nothing invented.</text></g>
</svg>
