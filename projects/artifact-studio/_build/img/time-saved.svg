<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Where Artifact Studio saves time</title>
<desc id="d">Three jobs. A slide deck from your notes: one hour to several days by hand, about five minutes with the studio. A one-page report: one to two hours by hand, about five minutes. A second version for a new audience: an hour or more by hand, about two minutes. These are estimates, not measurements, and you still check every number.</desc>
<style>.grow{transform-box:fill-box;transform-origin:left;animation:grow 9s infinite}.s0,.s1,.s2{animation-name:growfast}
@keyframes grow{0%{transform:scaleX(0)}22%,100%{transform:scaleX(1)}}@keyframes growfast{0%,22%{transform:scaleX(0)}27%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.grow{animation:none}}</style>
<rect width="800" height="480" rx="20" fill="#0c2340"/>
<rect x="24" y="24" width="752" height="432" rx="16" fill="#fffdf5"/>
<text x="60" y="76" fill="#0c2340" font-size="28" font-weight="800">Where it saves your time</text>
<text x="60" y="122" fill="#0c2340" font-size="23" font-weight="800">A slide deck from your notes</text><rect x="600" y="98" width="140" height="30" rx="15" fill="#0c2340"/><text x="670" y="119" text-anchor="middle" fill="#ffd23f" font-size="17" font-weight="700">Start here</text>
<rect class="grow g0" x="60" y="136" width="560" height="26" rx="13" fill="#d3d8e2"/><text x="74" y="155" fill="#3a4658" font-size="18">By hand: 1 hour to several days</text>
<rect class="grow s0" x="60" y="168" width="70" height="26" rx="13" fill="#ffd23f"/><text x="142" y="187" fill="#0c2340" font-size="18" font-weight="700">With the studio: about 5 minutes</text><text x="60" y="226" fill="#0c2340" font-size="23" font-weight="800">A one-page report</text>
<rect class="grow g1" x="60" y="240" width="300" height="26" rx="13" fill="#d3d8e2"/><text x="74" y="259" fill="#3a4658" font-size="18">By hand: 1 to 2 hours</text>
<rect class="grow s1" x="60" y="272" width="70" height="26" rx="13" fill="#ffd23f"/><text x="142" y="291" fill="#0c2340" font-size="18" font-weight="700">With the studio: about 5 minutes</text><text x="60" y="330" fill="#0c2340" font-size="23" font-weight="800">A second version for a new audience</text>
<rect class="grow g2" x="60" y="344" width="250" height="26" rx="13" fill="#d3d8e2"/><text x="74" y="363" fill="#3a4658" font-size="18">By hand: 1 hour or more</text>
<rect class="grow s2" x="60" y="376" width="40" height="26" rx="13" fill="#ffd23f"/><text x="112" y="395" fill="#0c2340" font-size="18" font-weight="700">With the studio: about 2 minutes</text>
<text x="60" y="436" fill="#5a6577" font-size="17">Estimates, not measurements. You still check every number.</text>
</svg>