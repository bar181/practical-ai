<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Making a presentation by hand, compared with Artifact Studio</title>
<desc id="d">By hand: open PowerPoint, pick a theme, copy and paste, hunt for images, fix the alignment, start again. One hour to several days. With Artifact Studio: say "show this as a visionary deck" and a deck appears, then say "now a how-to guide for my ops team" and a report appears. A solid draft in about five minutes.</desc>
