<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="ui-rounded,'SF Pro Rounded',Nunito,'Segoe UI',system-ui,sans-serif">
<title id="t">How Rare Find plays: the rarer the right answer, the more it scores</title>
<desc id="d">The prompt Name a bird with a timer ring. Answers appear in turn with their points: Eagle, the crowd pick, 25. Flamingo, 9th most popular, 38. Hummingbird, right but not in the top ten, a Good find, 80. Shoebill, a rare right answer, a Gem, 100. A bar grows with the points each time. Underneath: the rarer the right answer, the more it scores.</desc>
<style>
.s{opacity:0;animation:show 12s infinite}
.s2{animation-delay:3s}.s3{animation-delay:6s}.s4{animation-delay:9s}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 12s infinite}
.b2{animation-delay:3s}.b3{animation-delay:6s}.b4{animation-delay:9s}
.ring{stroke-dasharray:176;animation:ring 3s linear infinite}
@keyframes show{0%{opacity:0}3%,23%{opacity:1}25%,100%{opacity:0}}
@keyframes grow{0%{transform:scaleX(0)}6%,23%{transform:scaleX(1)}25%,100%{transform:scaleX(0)}}
@keyframes ring{from{stroke-dashoffset:0}to{stroke-dashoffset:176}}
@media (prefers-reduced-motion:reduce){.s,.bar,.ring{animation:none}.s{opacity:0}.s4{opacity:1}.bar{transform:scaleX(0)}.b4{transform:none}}
</style>
<rect width="800" height="420" rx="22" fill="#1a1530"/>
<!-- prompt card -->
<rect x="40" y="36" width="720" height="104" rx="18" fill="#262046"/>
<text x="72" y="74" fill="#bdb6dc" font-size="16" font-weight="800" letter-spacing="1">ANIMALS · TODAY</text>
<text x="72" y="116" fill="#f5f2ff" font-size="38" font-weight="800">Name a bird</text>
<g transform="translate(690 88)">
  <circle r="28" fill="none" stroke="#322a5c" stroke-width="8"/>
  <circle class="ring" r="28" fill="none" stroke="#3ccb7f" stroke-width="8" stroke-linecap="round" transform="rotate(-90)"/>
  <text y="8" text-anchor="middle" fill="#f5f2ff" font-size="20" font-weight="800">30</text>
</g>
<!-- answer and result, four in turn -->
<rect x="40" y="160" width="720" height="150" rx="18" fill="#262046"/>
<g font-weight="800">
  <g class="s s1"><text x="72" y="206" fill="#f5f2ff" font-size="30">Eagle</text>
    <rect x="72" y="226" width="140" height="40" rx="12" fill="#a3a9bf"/><text x="142" y="253" text-anchor="middle" fill="#1a1530" font-size="18">Crowd pick</text>
    <text x="236" y="257" fill="#f5f2ff" font-size="34">25</text><text x="318" y="256" fill="#bdb6dc" font-size="16" font-weight="600">#1 most popular</text></g>
  <g class="s s2"><text x="72" y="206" fill="#f5f2ff" font-size="30">Flamingo</text>
    <rect x="72" y="226" width="140" height="40" rx="12" fill="#3ccb7f"/><text x="142" y="253" text-anchor="middle" fill="#1a1530" font-size="18">Top ten</text>
    <text x="236" y="257" fill="#f5f2ff" font-size="34">38</text><text x="318" y="256" fill="#bdb6dc" font-size="16" font-weight="600">#9: rarer, so more</text></g>
  <g class="s s3"><text x="72" y="206" fill="#f5f2ff" font-size="30">Hummingbird</text>
    <rect x="72" y="226" width="140" height="40" rx="12" fill="#b48aff"/><text x="142" y="253" text-anchor="middle" fill="#1a1530" font-size="18">Good find</text>
    <text x="236" y="257" fill="#f5f2ff" font-size="34">80</text><text x="318" y="256" fill="#bdb6dc" font-size="16" font-weight="600">right, beyond the top ten</text></g>
  <g class="s s4"><text x="72" y="206" fill="#f5f2ff" font-size="30">Shoebill</text>
    <rect x="72" y="226" width="140" height="40" rx="12" fill="#ffc93c"/><text x="142" y="253" text-anchor="middle" fill="#1a1530" font-size="18">Gem</text>
    <text x="236" y="257" fill="#f5f2ff" font-size="34">100</text><text x="318" y="256" fill="#bdb6dc" font-size="16" font-weight="600">rare and right</text></g>
</g>
<!-- points bar -->
<rect x="520" y="200" width="200" height="22" rx="11" fill="#322a5c"/>
<rect class="bar b1" x="520" y="200" width="50" height="22" rx="11" fill="#a3a9bf"/>
<rect class="bar b2" x="520" y="200" width="76" height="22" rx="11" fill="#3ccb7f"/>
<rect class="bar b3" x="520" y="200" width="160" height="22" rx="11" fill="#b48aff"/>
<rect class="bar b4" x="520" y="200" width="200" height="22" rx="11" fill="#ffc93c"/>
<text x="520" y="250" fill="#bdb6dc" font-size="14" font-weight="700">0</text><text x="720" y="250" fill="#bdb6dc" font-size="14" font-weight="700" text-anchor="end">100</text>
<text x="620" y="284" fill="#bdb6dc" font-size="14" font-weight="600" text-anchor="middle">points for this answer</text>
<!-- tagline -->
<text x="400" y="364" text-anchor="middle" fill="#ffc93c" font-size="26" font-weight="800">The rarer the right answer, the more it scores.</text>
<text x="400" y="394" text-anchor="middle" fill="#bdb6dc" font-size="16" font-weight="600">Five prompts a day, the same for everyone. Popularity is the AI's estimate.</text>
</svg>
