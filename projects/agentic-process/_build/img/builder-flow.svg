<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">How the builder turns a job you repeat into a checked tool</title>
<desc id="d">A job you repeat goes in at the top. Four steps light up in turn: one, name the usable result, who uses it and the one catch to spot; two, pick the simplest build, reusing what exists; three, write the instructions once, with a guide and an example; four, test it in a fresh session, asking whether it holds up and whether the reader would use it, with a loop back to fix. At the bottom, the package you get: a guide, the instructions and a worked example, checked before you get it.</desc>
<style>
.st{animation:lit 12s infinite}
.s2{animation-delay:2.4s}.s3{animation-delay:4.8s}.s4{animation-delay:7.2s}
@keyframes lit{0%{fill:#17365f;stroke:#3d5f8f}3%,18%{fill:#21497d;stroke:#ffd23f}22%,100%{fill:#17365f;stroke:#3d5f8f}}
.out{animation:pop 12s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,78%{opacity:.6;transform:scale(.97)}84%,97%{opacity:1;transform:none}100%{opacity:.6;transform:scale(.97)}}
.fix{opacity:0;animation:fix 12s infinite}
@keyframes fix{0%,62%{opacity:0}66%,76%{opacity:1}80%,100%{opacity:0}}
.flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){.st,.out,.fix,.flow{animation:none}.out{opacity:1}.st{stroke:#ffd23f}}
</style>
<rect width="640" height="860" rx="22" fill="#0c2340"/>
<text x="320" y="58" text-anchor="middle" fill="#ffd23f" font-size="30" font-weight="700">A job in. A checked tool out.</text>

<g transform="rotate(-2 320 120)">
  <rect x="150" y="84" width="340" height="72" rx="8" fill="#fffdf5"/>
  <text x="320" y="117" text-anchor="middle" fill="#0c2340" font-size="24" font-weight="700">A job you repeat</text>
  <text x="320" y="143" text-anchor="middle" fill="#3a4658" font-size="19">"Every week I get supplier notices..."</text>
</g>

<path class="flow" d="M58 170v520" stroke="#8fb3e8" stroke-width="4" stroke-linecap="round"/>

<g font-size="28" font-weight="700" fill="#fff">
  <rect class="st s1" x="84" y="180" width="520" height="104" rx="16" fill="#17365f" stroke="#3d5f8f" stroke-width="3"/>
  <circle cx="58" cy="232" r="20" fill="#ffd23f"/><text x="58" y="241" text-anchor="middle" fill="#0c2340" font-size="24">1</text>
  <text x="108" y="224">Name the usable result</text>
  <text x="108" y="258" font-size="20" font-weight="400" fill="#cfd8e6">Who uses it, what they give, one catch to spot</text>

  <rect class="st s2" x="84" y="300" width="520" height="104" rx="16" fill="#17365f" stroke="#3d5f8f" stroke-width="3"/>
  <circle cx="58" cy="352" r="20" fill="#ffd23f"/><text x="58" y="361" text-anchor="middle" fill="#0c2340" font-size="24">2</text>
  <text x="108" y="344">Pick the simplest build</text>
  <text x="108" y="378" font-size="20" font-weight="400" fill="#cfd8e6">Reuse what exists; build only what is missing</text>

  <rect class="st s3" x="84" y="420" width="520" height="104" rx="16" fill="#17365f" stroke="#3d5f8f" stroke-width="3"/>
  <circle cx="58" cy="472" r="20" fill="#ffd23f"/><text x="58" y="481" text-anchor="middle" fill="#0c2340" font-size="24">3</text>
  <text x="108" y="464">Write the instructions once</text>
  <text x="108" y="498" font-size="20" font-weight="400" fill="#cfd8e6">Paste into any chatbot, or install as a skill</text>

  <rect class="st s4" x="84" y="540" width="520" height="132" rx="16" fill="#17365f" stroke="#3d5f8f" stroke-width="3"/>
  <circle cx="58" cy="592" r="20" fill="#ffd23f"/><text x="58" y="601" text-anchor="middle" fill="#0c2340" font-size="24">4</text>
  <text x="108" y="584">Test it in a fresh session</text>
  <text x="108" y="618" font-size="20" font-weight="400" fill="#cfd8e6">Does it hold up?</text>
  <text x="108" y="648" font-size="20" font-weight="400" fill="#cfd8e6">Would the reader use it as it is?</text>
</g>
<g class="fix">
  <path d="M604 606c34 0 34-134 0-134" fill="none" stroke="#ffd23f" stroke-width="4" stroke-linecap="round"/>
  <path d="M612 464l-10 8 12 6" fill="none" stroke="#ffd23f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="560" y="540" fill="#ffd23f" font-size="20" font-weight="700" text-anchor="end">fix</text>
</g>

<g class="out">
  <rect x="40" y="700" width="560" height="134" rx="16" fill="#fffdf5"/>
  <text x="66" y="738" fill="#0c2340" font-size="24" font-weight="700">You get</text>
  <g font-size="21" font-weight="600" fill="#0c2340">
    <rect x="66" y="756" width="150" height="40" rx="9" fill="#ffd23f"/><text x="141" y="783" text-anchor="middle">A guide</text>
    <rect x="232" y="756" width="150" height="40" rx="9" fill="#ffd23f"/><text x="307" y="783" text-anchor="middle">Instructions</text>
    <rect x="398" y="756" width="176" height="40" rx="9" fill="#ffd23f"/><text x="486" y="783" text-anchor="middle">An example</text>
  </g>
  <path d="M68 816l8 8 14-16" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="824" fill="#3a4658" font-size="19">Checked before you get it</text>
</g>
</svg>
