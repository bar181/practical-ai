<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">How the Practical AI guide works</title>
<desc id="d">Plays once. Three steps. 1: your question in any chatbot or coding tool, for example: I get 40-page supplier contracts, which tool should I use? 2: one link gives your AI the index, llms.txt, with every tool, its promise and links; it opens the file before it answers. 3: the answer and its file: use Document to action brief, with the source named; and when something is not covered, it says so. At the bottom: answer first, the file named, and not in the material instead of a guess.</desc>
<style>
.s{opacity:0;animation:in .7s ease-out forwards}
.d1{animation-delay:1.2s}.d2{animation-delay:1.9s}.d3{animation-delay:2.6s}.d4{animation-delay:3.3s}.d5{animation-delay:4.2s}.d6{animation-delay:4.9s}.d7{animation-delay:5.6s}.d8{animation-delay:6.3s}.d9{animation-delay:7.4s}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.s{animation:none;opacity:1}}
.h{font-size:20px;font-weight:700;fill:#0c2340}.p{font-size:14px;fill:#33415c}.n{font-size:15px;font-weight:700;fill:#ffffff}
.lab{font-size:12.5px;font-weight:700;fill:#0c2340}.v{font-size:12.5px;fill:#33415c}.ok{font-size:12px;font-weight:700;fill:#0f5e63}.no{font-size:12px;font-weight:700;fill:#b42318}
</style>
<rect width="800" height="360" rx="18" fill="#f4f6fa"/>
<g class="s"><circle cx="44" cy="44" r="16" fill="#5b3f8c"/><text x="44" y="49.5" text-anchor="middle" class="n">1</text><text x="70" y="50" class="h">Your question</text><rect x="34" y="78" width="196" height="160" rx="12" fill="#fff" stroke="#c9d1de"/></g>
<g class="s"><text x="48" y="104" class="v">&quot;I get 40-page supplier</text><text x="48" y="122" class="v">contracts. Which tool</text><text x="48" y="140" class="v">should I use?&quot;</text></g>
<g class="s"><text x="48" y="168" class="lab">Any chatbot or</text><text x="48" y="186" class="lab">coding tool</text></g>
<text class="s " x="132" y="266" text-anchor="middle" font-size="14" fill="#33415c">Ask it in your words</text>
<path class="s d1" d="M242 158 h36" stroke="#8fa0ba" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
<g class="s d1"><circle cx="300" cy="44" r="16" fill="#5b3f8c"/><text x="300" y="49.5" text-anchor="middle" class="n">2</text><text x="326" y="50" class="h">One link, the index</text><rect x="290" y="78" width="230" height="160" rx="12" fill="#fff" stroke="#c9d1de"/></g>
<g class="s d2"><text x="304" y="104" class="lab">llms.txt</text></g>
<g class="s d3"><text x="304" y="132" class="v">every tool, its promise</text><text x="304" y="150" class="v">and its links</text></g>
<g class="s d4"><text x="304" y="178" class="ok">Opens the file before</text><text x="304" y="196" class="ok">it answers</text></g>
<text class="s d4" x="405" y="266" text-anchor="middle" font-size="14" fill="#33415c">Nothing from memory</text>
<path class="s d5" d="M532 158 h36" stroke="#8fa0ba" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
<g class="s d5"><circle cx="590" cy="44" r="16" fill="#5b3f8c"/><text x="590" y="49.5" text-anchor="middle" class="n">3</text><text x="616" y="50" class="h">The answer</text><rect x="580" y="78" width="190" height="160" rx="12" fill="#fff" stroke="#c9d1de"/></g>
<g class="s d6"><text x="594" y="104" class="lab">Use Document to</text><text x="594" y="122" class="lab">action brief</text></g>
<g class="s d7"><text x="594" y="150" class="ok">Source: its README</text></g>
<g class="s d8"><text x="594" y="178" class="no">Not covered? It says so</text></g>
<text class="s d8" x="675" y="266" text-anchor="middle" font-size="14" fill="#33415c">With the file it came from</text>
<text class="s d9" x="400" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#0c2340">Answer first, the file named, and &quot;not in the material&quot; instead of a guess.</text>
</svg>
