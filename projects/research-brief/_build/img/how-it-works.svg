<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">How Research brief with checked sources works</title>
<desc id="d">Plays once. Three steps. 1: give the choice, the options, what matters and your sources or a report to check. 2: every claim is read against its page: Bookwell 29 pounds a month is checked with its words; SlotPilot no contract is flagged because the page says a 12-month minimum term; most salons use Chairtime is flagged because it has no source. 3: one page to share: a table where every cell has a source number, a warning sign or not found. At the bottom: every cell has its words. You check the flags and decide.</desc>
<style>
.s{opacity:0;animation:in .7s ease-out forwards}
.s2{animation-delay:1.2s}.s3{animation-delay:2.4s}.r1{animation-delay:3.0s}.r2{animation-delay:3.7s}.r3{animation-delay:4.4s}
.k1{animation-delay:5.4s}.k2{animation-delay:6.0s}.k3{animation-delay:6.6s}.f{animation-delay:7.6s}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.s{animation:none;opacity:1}}
.h{font-size:20px;font-weight:700;fill:#0c2340}.p{font-size:14px;fill:#33415c}.n{font-size:15px;font-weight:700;fill:#ffffff}
.lab{font-size:12.5px;font-weight:700;fill:#0c2340}.v{font-size:12.5px;fill:#33415c}.ok{font-size:12px;font-weight:700;fill:#0f5e63}.no{font-size:12px;font-weight:700;fill:#b45309}
</style>
<rect width="800" height="360" rx="18" fill="#f4f6fa"/>
<!-- step 1 -->
<g class="s">
  <circle cx="44" cy="44" r="16" fill="#0f5e63"/><text x="44" y="49.5" text-anchor="middle" class="n">1</text>
  <text x="70" y="50" class="h">Your question</text>
  <rect x="34" y="78" width="196" height="160" rx="14" fill="#fff" stroke="#c9d1de"/>
  <text x="50" y="104" class="lab">The choice</text><text x="50" y="122" class="v">a booking system</text>
  <text x="50" y="148" class="lab">The options</text><text x="50" y="166" class="v">Bookwell, SlotPilot,</text><text x="50" y="182" class="v">Chairtime</text>
  <text x="50" y="208" class="lab">Sources</text><text x="50" y="226" class="v">links, pages or a report</text>
  <text x="132" y="266" text-anchor="middle" class="p">Or paste a deep research report</text>
</g>
<path class="s s2" d="M242 158 h36" stroke="#8fa0ba" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
<!-- step 2 -->
<g class="s s2">
  <circle cx="306" cy="44" r="16" fill="#0f5e63"/><text x="306" y="49.5" text-anchor="middle" class="n">2</text>
  <text x="332" y="50" class="h">Each claim read</text>
  <rect x="290" y="78" width="230" height="160" rx="10" fill="#fff" stroke="#c9d1de"/>
</g>
<g class="s s3 r1"><text x="304" y="104" class="v">Bookwell £29 a month</text><text x="304" y="122" class="ok">✓ checked: "£29 a month"</text></g>
<g class="s s3 r2"><text x="304" y="152" class="v">SlotPilot: no contract</text><text x="304" y="170" class="no">⚠ page: 12-month term</text></g>
<g class="s s3 r3"><text x="304" y="200" class="v">"Most salons use Chairtime"</text><text x="304" y="218" class="no">⚠ no source</text></g>
<text class="s r3" x="405" y="266" text-anchor="middle" font-size="14" fill="#33415c">Problems go first</text>
<path class="s k1" d="M532 158 h36" stroke="#8fa0ba" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
<!-- step 3 -->
<g class="s k1">
  <circle cx="596" cy="44" r="16" fill="#0f5e63"/><text x="596" y="49.5" text-anchor="middle" class="n">3</text>
  <text x="622" y="50" class="h">One page</text>
  <rect x="580" y="78" width="190" height="160" rx="10" fill="#fff" stroke="#c9d1de"/>
  <path d="M580 112h190M580 150h190M580 188h190M664 78v160" stroke="#dde3ec" stroke-width="2"/>
  <text x="592" y="100" class="lab">Monthly</text><text x="676" y="100" class="v">£29 [1]</text>
</g>
<g class="s k2"><text x="592" y="136" class="lab">Card fee</text><text x="676" y="136" class="v">1.9% + 20p [1]</text></g>
<g class="s k2"><text x="592" y="174" class="lab">Contract</text><text x="676" y="174" class="v">30 days [1]</text></g>
<g class="s k3"><text x="592" y="212" class="lab">Deposits</text><text x="676" y="212" class="no">⚠ see flags</text></g>
<text class="s k3" x="675" y="266" text-anchor="middle" font-size="14" fill="#33415c">The words behind each number</text>
<text class="s f" x="400" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#0c2340">Every cell has its words. You check the flags and decide.</text>
</svg>
