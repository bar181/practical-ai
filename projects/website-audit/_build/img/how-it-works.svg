<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">How Website audit works</title>
<desc id="d">Plays once. Three steps. 1: your site: its address or the page, your business in one line, and optional PageSpeed Insights and Observatory results. 2: eight areas scored with the evidence seen: the message, found in search and AI, speed, phones and access, trust, security, links and content, measured. 3: a score out of 100, the five fixes that move it most, and your core context card. The worked example scored 71, then 81 after the fixes. At the bottom: it reports; you or your developer make the changes.</desc>
<style>
.s{opacity:0;animation:in .7s ease-out forwards}
.d1{animation-delay:1.2s}.d2{animation-delay:1.9s}.d3{animation-delay:2.6s}.d4{animation-delay:3.3s}.d5{animation-delay:4.2s}.d6{animation-delay:4.9s}.d7{animation-delay:5.6s}.d8{animation-delay:6.3s}.d9{animation-delay:7.4s}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.s{animation:none;opacity:1}}
.h{font-size:20px;font-weight:700;fill:#0c2340}.p{font-size:14px;fill:#33415c}.n{font-size:15px;font-weight:700;fill:#ffffff}
.lab{font-size:12.5px;font-weight:700;fill:#0c2340}.v{font-size:12.5px;fill:#33415c}.ok{font-size:12px;font-weight:700;fill:#0f5e63}.no{font-size:12px;font-weight:700;fill:#b42318}
</style>
<rect width="800" height="360" rx="18" fill="#f4f6fa"/>
<g class="s"><circle cx="44" cy="44" r="16" fill="#0f5e63"/><text x="44" y="49.5" text-anchor="middle" class="n">1</text><text x="70" y="50" class="h">Your site</text><rect x="34" y="78" width="196" height="160" rx="12" fill="#fff" stroke="#c9d1de"/></g>
<g class="s"><text x="48" y="104" class="lab">The address,</text><text x="48" y="122" class="v">or paste the page</text></g>
<g class="s"><text x="48" y="150" class="lab">Your business</text><text x="48" y="168" class="v">in one line</text></g>
<g class="s"><text x="48" y="196" class="v">PageSpeed and Observatory</text><text x="48" y="214" class="v">results, if you have them</text></g>
<text class="s " x="132" y="266" text-anchor="middle" font-size="14" fill="#33415c">One minute to start</text>
<path class="s d1" d="M242 158 h36" stroke="#8fa0ba" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
<g class="s d1"><circle cx="300" cy="44" r="16" fill="#0f5e63"/><text x="300" y="49.5" text-anchor="middle" class="n">2</text><text x="326" y="50" class="h">Eight areas scored</text><rect x="290" y="78" width="230" height="160" rx="12" fill="#fff" stroke="#c9d1de"/></g>
<g class="s d2"><text x="304" y="104" class="v">Message: what, for whom</text><text x="304" y="122" class="v">why you, what next</text></g>
<g class="s d3"><text x="304" y="150" class="v">Search and AI search</text></g>
<g class="s d4"><text x="304" y="178" class="v">Speed, phones, security,</text><text x="304" y="196" class="v">trust, links, measured</text></g>
<text class="s d4" x="405" y="266" text-anchor="middle" font-size="14" fill="#33415c">Each with the evidence seen</text>
<path class="s d5" d="M532 158 h36" stroke="#8fa0ba" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
<g class="s d5"><circle cx="590" cy="44" r="16" fill="#0f5e63"/><text x="590" y="49.5" text-anchor="middle" class="n">3</text><text x="616" y="50" class="h">Fix first</text><rect x="580" y="78" width="190" height="160" rx="12" fill="#fff" stroke="#c9d1de"/></g>
<g class="s d6"><text x="594" y="104" class="lab">A score out of 100</text></g>
<g class="s d7"><text x="594" y="132" class="ok">Five fixes, in order</text></g>
<g class="s d8"><text x="594" y="160" class="lab">Your core context card</text></g>
<g class="s d8"><text x="594" y="188" class="v">Example: 71, then 81</text></g>
<text class="s d8" x="675" y="266" text-anchor="middle" font-size="14" fill="#33415c">After the fixes the same day</text>
<text class="s d9" x="400" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#0c2340">It reports. You or your developer make the changes.</text>
</svg>
