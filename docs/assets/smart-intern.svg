<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">AI is a smart intern</title>
<desc id="d">A smart intern has read every book and has never met you. It needs four things from you: your priorities, your tone of voice, what your business does, and how it can help you. With those, it is ready to work.</desc>
<style>@keyframes n0{0%,10.00%{opacity:0;transform:translateY(8px)}14.50%,91.00%{opacity:1;transform:none}96.00%,100%{opacity:0;transform:none}}.n0{opacity:0;animation:n0 10s infinite}@keyframes n1{0%,21.00%{opacity:0;transform:translateY(8px)}25.50%,91.00%{opacity:1;transform:none}96.00%,100%{opacity:0;transform:none}}.n1{opacity:0;animation:n1 10s infinite}@keyframes n2{0%,32.00%{opacity:0;transform:translateY(8px)}36.50%,91.00%{opacity:1;transform:none}96.00%,100%{opacity:0;transform:none}}.n2{opacity:0;animation:n2 10s infinite}@keyframes n3{0%,43.00%{opacity:0;transform:translateY(8px)}47.50%,91.00%{opacity:1;transform:none}96.00%,100%{opacity:0;transform:none}}.n3{opacity:0;animation:n3 10s infinite}@keyframes ok{0%,58.00%{opacity:0;transform:translateY(8px)}62.50%,91.00%{opacity:1;transform:none}96.00%,100%{opacity:0;transform:none}}.ok{opacity:0;animation:ok 10s infinite}@media (prefers-reduced-motion:reduce){.n0,.n1,.n2,.n3,.ok{animation:none;opacity:1}.spin{animation:none}}</style>
<rect width="800" height="400" rx="20" fill="#0c2340"/>
<rect x="40" y="50" width="320" height="300" rx="16" fill="#17365f"/>
<circle cx="200" cy="124" r="40" fill="#ffd23f"/><circle cx="186" cy="116" r="5" fill="#0c2340"/><circle cx="214" cy="116" r="5" fill="#0c2340"/><path d="M184 134q16 14 32 0" fill="none" stroke="#0c2340" stroke-width="4" stroke-linecap="round"/>
<text x="200" y="210" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">Your smart intern</text>
<text x="200" y="250" text-anchor="middle" fill="#d5e2f5" font-size="21">Has read every book.</text>
<text x="200" y="280" text-anchor="middle" fill="#ffd23f" font-size="21" font-weight="700">Has never met you.</text>
<g class="ok"><rect x="110" y="300" width="180" height="36" rx="18" fill="#ffd23f"/><text x="200" y="325" text-anchor="middle" fill="#0c2340" font-size="19" font-weight="800">Ready to work</text></g>
<g class="n0"><rect x="404" y="50" width="356" height="62" rx="12" fill="#fffdf5"/><rect x="404" y="50" width="10" height="62" rx="5" fill="#ffd23f"/><text x="432" y="90" fill="#0c2340" font-size="23" font-weight="700">Your priorities</text></g><g class="n1"><rect x="404" y="130" width="356" height="62" rx="12" fill="#fffdf5"/><rect x="404" y="130" width="10" height="62" rx="5" fill="#ffd23f"/><text x="432" y="170" fill="#0c2340" font-size="23" font-weight="700">Your tone of voice</text></g><g class="n2"><rect x="404" y="210" width="356" height="62" rx="12" fill="#fffdf5"/><rect x="404" y="210" width="10" height="62" rx="5" fill="#ffd23f"/><text x="432" y="250" fill="#0c2340" font-size="23" font-weight="700">What your business does</text></g><g class="n3"><rect x="404" y="290" width="356" height="62" rx="12" fill="#fffdf5"/><rect x="404" y="290" width="10" height="62" rx="5" fill="#ffd23f"/><text x="432" y="330" fill="#0c2340" font-size="23" font-weight="700">How it can help you</text></g>
</svg>