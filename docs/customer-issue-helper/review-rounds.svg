<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="t d">
  <title id="t">Four review rounds of the customer issue helper</title>
  <desc id="d">Bar chart of four blind review rounds on invented inputs, scored out of 100 with a pass mark of 80. Round 1, bike repair shop: 82. Round 2, yoga studio: 82. Round 3, plant shop, with the policy book built first: 88. Round 4, dog groomer: 87. Under each bar is the main thing that round caught and that was then fixed. No person has used the tool yet.</desc>
  <style>
    :root { --bg:#fbfaf7; --ink:#1f2328; --mute:#5b6470; --line:#d6d3cc; --card:#ffffff; --accent:#2f6f5e; --pass:#9a3b3b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16181c; --ink:#eceff3; --mute:#a3abb6; --line:#3a3f47; --card:#20242a; --accent:#6cc3a8; --pass:#e58d8d; }
    }
    .bg { fill: var(--bg); }
    .h { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .s { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--mute); }
    .v { font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .r { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .axis { stroke: var(--line); stroke-width: 1.5; }
    .passline { stroke: var(--pass); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .pass { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--pass); }
    .bar { fill: var(--accent); transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: grow 9s infinite; }
    .old { fill: var(--accent); opacity: .55; }
    .lab { opacity: 0; animation: show 9s infinite; }
    .d1 { animation-delay: .3s; } .d2 { animation-delay: 1.1s; } .d3 { animation-delay: 1.9s; } .d4 { animation-delay: 2.7s; }
    @keyframes grow { 0% { transform: scaleY(0); } 10%, 88% { transform: scaleY(1); } 97%, 100% { transform: scaleY(0); } }
    @keyframes show { 0%, 8% { opacity: 0; } 14%, 88% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; transform: none; } .lab { animation: none; opacity: 1; } }
  </style>

  <rect class="bg" width="880" height="420" rx="16"/>
  <text class="h" x="40" y="42">Four blind review rounds, each on a new invented business</text>
  <text class="s" x="40" y="64">Score out of 100 from a fresh Claude reviewer. Each round's points lost were fixed before the next. Not yet tried by a person.</text>

  <!-- axis: 0 at y=320, 100 at y=120 (2px per point) -->
  <line class="axis" x1="60" y1="320" x2="840" y2="320"/>
  <line class="passline" x1="60" y1="160" x2="840" y2="160"/>
  <text class="pass" x="62" y="153">pass 80</text>

  <!-- Round 1: 82 -> height 164, y 156 -->
  <rect class="bar old d1" x="110" y="156" width="110" height="164" rx="6"/>
  <g class="lab d1">
    <text class="v" x="165" y="146" text-anchor="middle">82</text>
    <text class="r" x="165" y="344" text-anchor="middle">Round 1 · bike shop</text>
    <text class="s" x="165" y="364" text-anchor="middle">Caught: who did what</text>
    <text class="s" x="165" y="382" text-anchor="middle">was reversed</text>
  </g>

  <!-- Round 2: 82 -->
  <rect class="bar old d2" x="300" y="156" width="110" height="164" rx="6"/>
  <g class="lab d2">
    <text class="v" x="355" y="146" text-anchor="middle">82</text>
    <text class="r" x="355" y="344" text-anchor="middle">Round 2 · yoga studio</text>
    <text class="s" x="355" y="364" text-anchor="middle">Caught: a promise resting</text>
    <text class="s" x="355" y="382" text-anchor="middle">on its own reading</text>
  </g>

  <!-- Round 3: 88 -> height 176, y 144 -->
  <rect class="bar d3" x="490" y="144" width="110" height="176" rx="6"/>
  <g class="lab d3">
    <text class="v" x="545" y="134" text-anchor="middle">88</text>
    <text class="r" x="545" y="344" text-anchor="middle">Round 3 · plant shop</text>
    <text class="s" x="545" y="364" text-anchor="middle">Policy book built first;</text>
    <text class="s" x="545" y="382" text-anchor="middle">caught: last-day requests</text>
  </g>

  <!-- Round 4: 87 -> height 174, y 146 -->
  <rect class="bar d4" x="680" y="146" width="110" height="174" rx="6"/>
  <g class="lab d4">
    <text class="v" x="735" y="136" text-anchor="middle">87</text>
    <text class="r" x="735" y="344" text-anchor="middle">Round 4 · dog groomer</text>
    <text class="s" x="735" y="364" text-anchor="middle">Caught: a staff quote</text>
    <text class="s" x="735" y="382" text-anchor="middle">stated as fact</text>
  </g>

  <text class="s" x="40" y="408">Rounds 1 to 2: 25 Nov 2026; 3 to 4: 27 Nov 2026. All inputs invented. Fixes after round 4 not yet re-scored.</text>
</svg>
